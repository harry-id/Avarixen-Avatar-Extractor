# Development override for local work. Do NOT use in production.
#
# Run with both files so the override is layered on top of the base config:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up
#
# It relaxes resource limits (more CPUs, optionally more memory) so local
# conversions are faster, and activates the development preset
# (NODE_ENV=development). All other settings come from compose.yaml.
#
# Port publishing is inherited from compose.yaml, which binds to
# 127.0.0.1 only (127.0.0.1:7860:7860); this override does not widen it.
services:
  backend:
    environment:
      NODE_ENV: development
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "2G"
          pids: 1024