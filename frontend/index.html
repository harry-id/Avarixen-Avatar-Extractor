<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="appTitle">Avarixen Avatar Extractor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #10131c;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            background: #191e2b;
            border-bottom: 1px solid #30394d;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            color: #aab4c8;
            margin: 0;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .lang-selector label {
            color: #aab4c8;
            font-size: 13px;
            white-space: nowrap;
        }

        .lang-selector select {
            background: #191e2b;
            color: #fff;
            border: 1px solid #39445c;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .lang-selector select:focus {
            border-color: #4285f4;
            outline: none;
        }

        .api-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #aab4c8;
            padding: 4px 10px;
            background: #191e2b;
            border: 1px solid #30394d;
            border-radius: 6px;
            white-space: nowrap;
        }

        .api-status .api-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            flex-shrink: 0;
            box-shadow: 0 0 4px rgba(76, 175, 80, 0.6);
        }

        .api-status.offline .api-dot {
            background: #f44336;
            box-shadow: 0 0 4px rgba(244, 67, 54, 0.6);
        }

        .api-status.offline {
            color: #f44336;
        }

        main {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #39445c;
            border-radius: 8px;
            background: #191e2b;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4285f4;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4285f4;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #accountInfo {
            display: none;
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 12px 14px;
            background: rgba(25, 30, 43, 0.7);
            border: 1px solid #39445c;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.7;
            pointer-events: none;
            max-width: 60%;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #viewer {
            width: 100%;
            height: 500px;
            background: #202738;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }

        /* Viewer + model explorer sidebar layout */
        .viewer-layout {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .viewer-layout #viewer {
            flex: 1;
            min-width: 0;
        }

        #explorer {
            width: 240px;
            height: 500px;
            flex-shrink: 0;
            background: #191e2b;
            border: 1px solid #30394d;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .explorer-header {
            padding: 12px 14px;
            border-bottom: 1px solid #30394d;
            font-size: 13px;
            font-weight: bold;
            color: #aab4c8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .explorer-header .explorer-count {
            font-weight: normal;
            color: #6c7a94;
            font-size: 12px;
        }

        .explorer-title-group {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
        }

        .explorer-header .explorer-size {
            font-weight: normal;
            color: #556070;
            font-size: 11px;
            white-space: nowrap;
        }

        .explorer-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            font-size: 13px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .explorer-tree::-webkit-scrollbar {
            display: none;
        }

        .explorer-empty {
            padding: 20px 14px;
            color: #6c7a94;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        .explorer-node {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            cursor: default;
            white-space: nowrap;
        }

        .explorer-node:hover {
            background: #202738;
        }

        .explorer-node .node-icon {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .explorer-node .node-icon.player {
            background: #4285f4;
        }

        .explorer-node .node-icon.handle {
            background: #a142f4;
        }

        .explorer-node .node-icon.other {
            background: #6c7a94;
        }

        .explorer-node .node-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .explorer-node .node-meta {
            color: #6c7a94;
            font-size: 11px;
            flex-shrink: 0;
        }

        .explorer-section-label {
            padding: 10px 12px 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c7a94;
        }

        /* Download options (checkboxes) */
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 12px;
            padding: 0;
            background: transparent;
            border: none;
            border-radius: 0;
        }

        .option-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #d0d8e8;
            cursor: pointer;
            user-select: none;
        }

        .option-checkbox[hidden] {
            display: none;
        }

        .option-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4285f4;
            cursor: pointer;
        }

        .option-checkbox .experimental-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #3a2a1a;
            color: #f0a030;
            font-weight: bold;
        }

        .option-checkbox .legacy-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #2a2a2a;
            color: #999;
            font-weight: bold;
        }

        /* Footer */
        .footer {
            max-width: 1400px;
            margin: 28px auto 0;
            padding: 20px 20px 12px;
            border-top: 1px solid #30394d;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            text-align: left;
        }

        .footer-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: flex-start;
            align-items: flex-start;
        }

        .footer-links a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #aab4c8;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.15s ease;
        }

        .footer-links a:hover {
            color: #4285f4;
        }

        .footer-links a svg {
            flex-shrink: 0;
        }

        .footer-tag {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
            background: #202738;
            color: #6c7a94;
            font-weight: normal;
        }

        .footer .copyright {
            color: #6c7a94;
            font-size: 12px;
            margin: 0;
        }

        .footer .copyright a {
            color: #6c7a94;
            text-decoration: none;
        }

        .footer .copyright a:hover {
            color: #4285f4;
        }

        @media (max-width: 900px) {
            .viewer-layout {
                flex-direction: column;
            }

            #explorer {
                width: 100%;
                max-height: 200px;
            }
        }

        .status {
            margin-top: 15px;
            color: #aab4c8;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .split-button {
            display: flex;
        }

        .split-button #downloadButton {
            min-width: 140px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .split-button .arrow-button {
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.35);
        }

        .dropdown-content {
            display: none;
            position: fixed;
            background-color: #191e2b;
            width: 240px;
            max-height: 280px;
            overflow-y: auto;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 1px solid #39445c;
            z-index: 1000;
            scrollbar-width: thin;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content button {
            width: 100%;
            padding: 9px 14px;
            text-align: left;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dropdown-content button:hover {
            background: #202738;
        }

        .dropdown-content button.selected::before {
            content: "✓ ";
            color: #4285f4;
        }

        .dropdown-content button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            #viewer {
                height: 380px;
            }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

<header>
    <div class="brand">
        <div class="brand-row">
            <h1 data-i18n="appTitle">Avarixen Avatar Extractor</h1>
            <div class="api-status" id="apiStatus" title="Backend API status">
                <span class="api-dot"></span>
                <span id="apiStatusText">API Online</span>
            </div>
        </div>
        <p data-i18n="appSubtitle">Roblox Avatar 3D Preview</p>
    </div>
    <div class="lang-selector">
        <label for="langSelector" data-i18n="languageLabel">Bahasa / Language:</label>
        <select id="langSelector">
            <option value="id">Indonesia</option>
            <option value="en">English</option>
        </select>
    </div>
</header>

<main>

    <form class="search-box" id="searchForm">
        <input
            type="text"
            id="searchInput"
            placeholder="Masukkan username Roblox..."
            autocomplete="off"
        >

        <button type="submit" id="searchButton" data-i18n="searchButton">
            Cari Avatar
        </button>
    </form>

    <div class="viewer-layout">
        <div id="viewer">
            <div id="accountInfo"></div>
        </div>
        <aside id="explorer">
            <div class="explorer-header">
                <div class="explorer-title-group">
                    <span data-i18n="explorerTitle">Model Explorer</span>
                    <span class="explorer-size" id="explorerSize"></span>
                </div>
                <span class="explorer-count" id="explorerCount"></span>
            </div>
            <div class="explorer-tree" id="explorerTree">
                <div class="explorer-empty" data-i18n="explorerEmpty">
                    Load an avatar to see its parts.
                </div>
            </div>
        </aside>
    </div>

    <div class="status" id="status" data-i18n="statusWaiting">
        Masukkan username Roblox untuk memuat pratinjau 3D.
    </div>

    <div class="controls">
        <button id="reloadButton" data-i18n="reloadButton">
            Muat Ulang Model
        </button>

        <div class="dropdown">
            <div class="split-button">
                <button id="downloadButton" data-i18n="downloadObj">
                    Unduh OBJ
                </button>
                <button
                    type="button"
                    id="downloadToggle"
                    class="arrow-button"
                    data-i18n-title="downloadFormatLabel"
                    title="Pilih format unduhan"
                    aria-haspopup="true"
                    aria-expanded="false"
                >▼</button>
            </div>
            <div id="downloadDropdown" class="dropdown-content" role="menu">
                <button class="dropdown-item" data-format="obj" data-i18n="downloadObjOption" role="menuitemradio" aria-checked="false">
                    Unduh OBJ (OBJ + MTL + Texture)
                </button>
                <button class="dropdown-item" data-format="glb" data-i18n="downloadGlb" role="menuitemradio" aria-checked="false">
                    Unduh GLB
                </button>
                <button class="dropdown-item" data-format="gltf" data-i18n="downloadGltf" role="menuitemradio" aria-checked="false">
                    Unduh GLTF
                </button>
                <button class="dropdown-item" data-format="fbx" data-i18n="downloadFbx" role="menuitemradio" aria-checked="false">
                    Unduh FBX (Legacy)
                </button>
            </div>
        </div>
    </div>

    <div class="options">
        <label class="option-checkbox">
            <input type="checkbox" id="separateAssets">
            <span data-i18n="optionSeparateAssets"
                  data-i18n-title="optionSeparateAssetsHint"
                  title="Export separate asset files (textures/bin) in one ZIP.">Separate assets</span>
        </label>
        <label class="option-checkbox">
            <input type="checkbox" id="autoRig">
            <span data-i18n="optionAutoRig">Auto-rig (R6/R15)</span>
            <span class="experimental-badge">Experimental</span>
        </label>
    </div>

</main>

<footer class="footer">

        © 2026 <a href="https://github.com/Avarixen" target="_blank" rel="noopener noreferrer">Avarixen</a>. All rights reserved.
    </p>
</footer>

    const dict = LANG[currentLang] || LANG.en;
    let text = dict[key] || LANG.en[key] || key;

function loadModel(userId = null, bustCache = false) {

    const cacheBust = bustCache ? `?v=${Date.now()}` : "";

    const assetPath = userId
        ? `/assets/${encodeURIComponent(userId)}/`
        : "/assets/";

    setStatus("statusLoadingMaterial");

    const mtlLoader = new MTLLoader();

    mtlLoader.setPath(assetPath);

    mtlLoader.load(
        "avatar.mtl" + cacheBust,

        materials => {

            materials.preload();

            materials.materials = materials.materials || {};
            Object.values(materials.materials).forEach((material) => {
                if (!material) return;

                // Use both sides so faces aren't invisible
                material.side = THREE.DoubleSide;

                // Fix transparency: MTL "d" / "Tr" can force transparent:true
                // Keep opaque unless explicitly set in MTL
                if (material.transparent && material.opacity === 1) {
                    material.transparent = false;
                }

                // Ensure base color is white so MTL tint doesn't discolor textures (blue torso, etc.)
                material.color.setHex(0xffffff);

                // Default PBR values so legs don't go black in shadow
                material.roughness = material.roughness !== undefined ? material.roughness : 0.6;
                material.metalness = material.metalness !== undefined ? material.metalness : 0.05;

                // Fix texture color space (sRGB for diffuse/albedo maps)
                if (material.map) {
                    material.map.colorSpace = THREE.SRGBColorSpace;
                    material.map.needsUpdate = true;
                }
                if (material.aoMap) {
                    material.aoMap.colorSpace = THREE.SRGBColorSpace;
                    material.aoMap.needsUpdate = true;
                }
                if (material.emissiveMap) {
                    material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                    material.emissiveMap.needsUpdate = true;
                }
                if (material.specularMap) {
                    material.specularMap.colorSpace = THREE.SRGBColorSpace;
                    material.specularMap.needsUpdate = true;
                }
                if (material.alphaMap) {
                    material.alphaMap.colorSpace = THREE.SRGBColorSpace;
                    material.alphaMap.needsUpdate = true;
                }

                material.needsUpdate = true;
            });

            const objLoader = new OBJLoader();

            objLoader.setMaterials(materials);

            objLoader.setPath(assetPath);

            setStatus("statusLoadingModel");

            objLoader.load(
                "avatar.obj" + cacheBust,

                object => {

                    if (currentModel) {
                        scene.remove(currentModel);
                    }

                    currentModel = object;

                    scene.add(object);

                    const box = new THREE.Box3()
                        .setFromObject(object);

                    const center = box.getCenter(
                        new THREE.Vector3()
                    );

                    const size = box.getSize(
                        new THREE.Vector3()
                    );

                    object.position.sub(center);

                    const maxSize = Math.max(
                        size.x,
                        size.y,
                        size.z
                    );

                    camera.position.set(
                        0,
                        0,
                        -maxSize * 2.5
                    );

                    camera.lookAt(0, 0, 0);

                    controls.target.set(0, 0, 0);

                    controls.update();

                    setStatus("statusLoaded");

                },

                undefined,

                error => {

                    console.error(error);

                    setStatus(userId ? "statusLoadObjFailed" : "statusNoLocalModel");

                }
            );

        },

        undefined,

        error => {

            console.error(error);

            setStatus(userId ? "statusLoadMtlFailed" : "statusNoLocalModel");

        }
    );

}

function formatSize(bytes) {
    if (!bytes || bytes < 0) return "";
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

async function buildExplorer(userId) {

    const treeEl = document.getElementById("explorerTree");

    const countEl = document.getElementById("explorerCount");

    if (!userId) {

        treeEl.innerHTML = `<div class="explorer-empty">${t("explorerEmpty")}</div>`;

        countEl.textContent = "";

        setExplorerSize(null);

        return;

    }

    let groups = null;

    // Try the backend part-mapping endpoint first (gives body-part names).
    try {

        const resp = await fetch(

            `${BACKEND_URL}/api/roblox/parts/${encodeURIComponent(userId)}`,

            { headers: apiHeaders() }

        );

        if (resp.ok) {

            const data = await resp.json();

            if (data.success && Array.isArray(data.groups)) {

                groups = data.groups;

            }

        }

    } catch (e) {

        console.warn("Parts endpoint failed, falling back to client-side parse", e);

    }

    // Fallback: parse the OBJ client-side (group names only, no body-part mapping).
    if (!groups) {

        try {

            const assetPath = `/assets/${encodeURIComponent(userId)}/`;

            const response = await fetch(assetPath + "avatar.obj");

            if (!response.ok) throw new Error("Failed to fetch OBJ");

            const text = await response.text();

            const parsed = {};

            let currentGroup = null;

            for (const raw of text.split(/\r?\n/)) {

                const line = raw.trim();

                if (line.startsWith("g ")) {

                    currentGroup = line.slice(2).trim() || null;

                    if (currentGroup && !parsed[currentGroup]) {

                        parsed[currentGroup] = { faces: 0, vertices: new Set() };

                    }

                } else if (line.startsWith("f ") && currentGroup) {

                    parsed[currentGroup].faces++;

                    const parts = line.split(/\s+/);

                    for (let i = 1; i < parts.length; i++) {

                        const v = parts[i].split("/")[0];

                        if (v) parsed[currentGroup].vertices.add(parseInt(v, 10));

                    }

                }

            }

            groups = Object.keys(parsed)

                .filter(n => parsed[n].faces > 0)

                .map(name => {

                    const type = name.startsWith("Player") ? "player"

                        : name.startsWith("Handle") ? "handle" : "other";

                    return { name, vertices: parsed[name].vertices.size, faces: parsed[name].faces, type, part: null };

                });

        } catch (e) {

            console.error(e);

            groups = [];

        }

    }

    const playerGroups = groups.filter(g => g.type === "player");

    const handleGroups = groups.filter(g => g.type === "handle");

    const otherGroups = groups.filter(g => g.type === "other");

    countEl.textContent = `${groups.length}`;

    let html = "";

    const renderSection = (label, list, cls) => {

        if (!list.length) return;

        html += `<div class="explorer-section-label">${label} (${list.length})</div>`;

        for (const g of list) {

            // Primary label = mapped body part (e.g. "Head"); secondary = group name + vertex count.
            const primary = g.part ? escapeHTML(g.part) : escapeHTML(g.name);

            const secondary = g.part

                ? `${escapeHTML(g.name)} · ${g.vertices} v`

                : `${g.vertices} v`;

            html += `<div class="explorer-node" title="${escapeHTML(g.name)}">`

                + `<span class="node-icon ${cls}"></span>`

                + `<span class="node-name">${primary}</span>`

                + `<span class="node-meta">${secondary}</span>`

                + `</div>`;

        }

    };

    renderSection(t("explorerPlayers"), playerGroups, "player");

    renderSection(t("explorerHandles"), handleGroups, "handle");

    renderSection(t("explorerOther"), otherGroups, "other");

    treeEl.innerHTML = html || `<div class="explorer-empty">${t("explorerEmpty")}</div>`;

}

async function downloadZip() {

    downloadButton.textContent = t("downloadCreating");

    const assetPath =
        `/assets/${encodeURIComponent(currentUserId)}/`;

    const safeName = String(currentDisplayName || "Avarixen").replace(/[\\/:*?"<>|]/g, "_").trim().replace(/[. ]+$/g, "") || "Avarixen";
    const baseName = safeName.toLowerCase();

    // Prefer the exact file list the download endpoint reported. The old HEAD
    // probe stopped at the first gap and silently dropped later textures.
    let files = [];

    if (currentAssetFiles && currentAssetFiles.length) {
        files = currentAssetFiles.map((file) => String(file).split("/").pop());
    } else {
        files = [
            "avatar.obj",
            "avatar.mtl"
        ];

        let textureIndex = 1;

        while (true) {
            const filename = `texture${textureIndex}.png`;

            const check = await fetch(assetPath + filename, {
                method: "HEAD"
            });

            if (!check.ok) break;

            files.push(filename);
            textureIndex++;
        }
    }

    const zip = new JSZip();

    for (const file of files) {

        const response = await fetch(
            assetPath + file
        );

        if (!response.ok) {

            throw new Error(
                t("errorZipFetch", { file })
            );

        }

        let content = await response.blob();

        if (file === "avatar.obj") {
            let objText = await content.text();
            objText = objText.replace(/^mtllib\s+.*$/m, `mtllib ${baseName}.mtl`);
            content = new Blob([objText], { type: "text/plain" });
        }

        if (file === "avatar.mtl") {
            content = new Blob(
                [await content.text()],
                { type: "text/plain" }
            );
        }

        const zipFileName =
            file === "avatar.obj" ? `${baseName}.obj` :
            file === "avatar.mtl" ? `${baseName}.mtl` :
            file;

        zip.file(
            `${safeName}/${zipFileName}`,
            content
        );

    }

    const blob = await zip.generateAsync({
        type: "blob"
    });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;

    link.download = `${safeName}_${currentUserId}.zip`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );

    setDownloadButtonLabel();
}

async function downloadConverted(format) {

    const rig = document.getElementById("autoRig").checked;

    // Separate assets: keep body parts as objects and bundle the model with
    // external texture/buffer files in one ZIP.
    const separate = document.getElementById("separateAssets").checked;

    const convertUrl = `${BACKEND_URL}/api/roblox/convert/${encodeURIComponent(currentUserId)}/${format}`;

    const params = new URLSearchParams();
    if (rig) params.set("rig", "1");
    if (separate) params.set("separate", "1");
    if (currentDisplayName) params.set("name", currentDisplayName);
    const qs = params.toString();
    const url = qs ? `${convertUrl}?${qs}` : convertUrl;

    if (rig) {
        setStatus("statusRigging");
    } else {
        setStatus("statusConverting", { format: format.toUpperCase() });
    }

    const response = await fetch(url, {
        headers: apiHeaders()
    });

    if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.message || t("errorConvertFailed", { message: "Unknown error" }));
    }

    const contentType = response.headers.get("content-type") || "";
    const blob = await response.blob();
    const objUrl = URL.createObjectURL(blob);

    const safeName = String(currentDisplayName || "Avarixen").replace(
        /[\\/:*?"<>|]/g,
        "_"
    ).trim().replace(/[. ]+$/g, "") || "Avarixen";

    // Separate mode returns a ZIP instead of a bare model file.
    let ext = format;
    if (contentType.includes("zip")) ext = "zip";

    const link = document.createElement("a");
    link.href = objUrl;
    link.download = `${safeName}_${currentUserId}.${ext}`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
    setStatus("statusDownloaded");
}



function resizeViewer() {

    const width = viewer.clientWidth;
    const height = viewer.clientHeight;

    // Mobile browsers can report 0 before the first layout pass.
    if (!width || !height) {
        return;
    }

    camera.aspect = width / height;

    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

}

window.addEventListener("resize", resizeViewer);
window.addEventListener("orientationchange", resizeViewer);
window.addEventListener("load", resizeViewer);

if ("ResizeObserver" in window) {
    new ResizeObserver(resizeViewer).observe(viewer);
}

requestAnimationFrame(resizeViewer);



function animate() {

    requestAnimationFrame(animate);

    controls.update();

    renderer.render(scene, camera);

}

animate();



setLang(currentLang);

// Check the backend API status on load, then every 30s.
renderApiStatus("checking");
checkApiStatus();
setInterval(checkApiStatus, 30000);

</script>

</body>
