<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="appTitle">Avarixen Avatar Extractor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #10131c;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            padding: 20px;
            background: #191e2b;
            border-bottom: 1px solid #30394d;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header p {
            color: #aab4c8;
            margin: 0;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .lang-selector label {
            color: #aab4c8;
            font-size: 13px;
            white-space: nowrap;
        }

        .lang-selector select {
            background: #191e2b;
            color: #fff;
            border: 1px solid #39445c;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .lang-selector select:focus {
            border-color: #4285f4;
            outline: none;
        }

        main {
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #39445c;
            border-radius: 8px;
            background: #191e2b;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #4285f4;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #4285f4;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #accountInfo {
            display: none;
            padding: 15px;
            margin-bottom: 15px;
            background: #191e2b;
            border: 1px solid #30394d;
            border-radius: 10px;
            line-height: 1.8;
        }

        #viewer {
            width: 100%;
            height: 500px;
            background: #202738;
            border-radius: 14px;
            overflow: hidden;
        }

        /* Viewer + model explorer sidebar layout */
        .viewer-layout {
            display: flex;
            gap: 12px;
            align-items: stretch;
        }

        .viewer-layout #viewer {
            flex: 1;
            min-width: 0;
        }

        #explorer {
            width: 240px;
            flex-shrink: 0;
            background: #191e2b;
            border: 1px solid #30394d;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .explorer-header {
            padding: 12px 14px;
            border-bottom: 1px solid #30394d;
            font-size: 13px;
            font-weight: bold;
            color: #aab4c8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .explorer-header .explorer-count {
            font-weight: normal;
            color: #6c7a94;
            font-size: 12px;
        }

        .explorer-tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
            font-size: 13px;
        }

        .explorer-empty {
            padding: 20px 14px;
            color: #6c7a94;
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        .explorer-node {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            cursor: default;
            white-space: nowrap;
        }

        .explorer-node:hover {
            background: #202738;
        }

        .explorer-node .node-icon {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .explorer-node .node-icon.player {
            background: #4285f4;
        }

        .explorer-node .node-icon.handle {
            background: #a142f4;
        }

        .explorer-node .node-icon.other {
            background: #6c7a94;
        }

        .explorer-node .node-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .explorer-node .node-meta {
            color: #6c7a94;
            font-size: 11px;
            flex-shrink: 0;
        }

        .explorer-section-label {
            padding: 10px 12px 4px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6c7a94;
        }

        /* Download options (checkboxes) */
        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 12px;
            padding: 12px 14px;
            background: #191e2b;
            border: 1px solid #30394d;
            border-radius: 10px;
        }

        .option-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #d0d8e8;
            cursor: pointer;
            user-select: none;
        }

        .option-checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #4285f4;
            cursor: pointer;
        }

        .option-checkbox .experimental-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #3a2a1a;
            color: #f0a030;
            font-weight: bold;
        }

        .option-checkbox .legacy-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #2a2a2a;
            color: #999;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .viewer-layout {
                flex-direction: column;
            }

            #explorer {
                width: 100%;
                max-height: 200px;
            }
        }

        .status {
            margin-top: 15px;
            color: #aab4c8;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .split-button {
            display: flex;
        }

        .split-button #downloadButton {
            min-width: 140px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .split-button .arrow-button {
            padding: 12px 14px;
            font-size: 12px;
            line-height: 1;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            border-left: 1px solid rgba(255, 255, 255, 0.35);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #191e2b;
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            border: 1px solid #39445c;
            z-index: 100;
            right: 0;
            top: 110%;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content button {
            width: 100%;
            padding: 10px 16px;
            text-align: left;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .dropdown-content button:hover {
            background: #202738;
        }

        .dropdown-content button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            #viewer {
                height: 380px;
            }
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

<header>
    <div class="brand">
        <h1 data-i18n="appTitle">Avarixen Avatar Extractor</h1>
        <p data-i18n="appSubtitle">Roblox Avatar 3D Preview</p>
    </div>
    <div class="lang-selector">
        <label for="langSelector" data-i18n="languageLabel">Bahasa / Language:</label>
        <select id="langSelector">
            <option value="id">Indonesia</option>
            <option value="en">English</option>
        </select>
    </div>
</header>

<main>

    <form class="search-box" id="searchForm">
        <input
            type="text"
            id="searchInput"
            placeholder="Masukkan username Roblox..."
            autocomplete="off"
        >

        <button type="submit" id="searchButton" data-i18n="searchButton">
            Cari Avatar
        </button>
    </form>

    <div id="accountInfo"></div>

    <div class="viewer-layout">
        <div id="viewer"></div>
        <aside id="explorer">
            <div class="explorer-header">
                <span data-i18n="explorerTitle">Model Explorer</span>
                <span class="explorer-count" id="explorerCount"></span>
            </div>
            <div class="explorer-tree" id="explorerTree">
                <div class="explorer-empty" data-i18n="explorerEmpty">
                    Load an avatar to see its parts.
                </div>
            </div>
        </aside>
    </div>

    <div class="status" id="status" data-i18n="statusWaiting">
        Masukkan username Roblox untuk memuat pratinjau 3D.
    </div>

    <div class="options">
        <label class="option-checkbox">
            <input type="checkbox" id="separateAssets">
            <span data-i18n="optionSeparateAssets">Separate assets</span>
        </label>
        <label class="option-checkbox">
            <input type="checkbox" id="autoRig">
            <span data-i18n="optionAutoRig">Auto-rig (R6/R15)</span>
            <span class="experimental-badge">Experimental</span>
        </label>
    </div>

    <div class="controls">
        <button id="reloadButton" data-i18n="reloadButton">
            Muat Ulang Model
        </button>

        <div class="dropdown">
            <div class="split-button">
                <button id="downloadButton" data-i18n="downloadObj">
                    Unduh OBJ
                </button>
                <button
                    type="button"
                    id="downloadToggle"
                    class="arrow-button"
                    data-i18n-title="downloadFormatLabel"
                    title="Pilih format unduhan"
                    aria-haspopup="true"
                    aria-expanded="false"
                >▼</button>
            </div>
            <div id="downloadDropdown" class="dropdown-content">
                <button class="dropdown-item" data-format="obj" data-i18n="downloadObjOption">
                    OBJ + MTL + Tekstur
                </button>
                <button class="dropdown-item" data-format="glb" data-i18n="downloadGlb">
                    Unduh Avatar (GLB)
                </button>
                <button class="dropdown-item" data-format="gltf" data-i18n="downloadGltf">
                    Unduh Avatar (GLTF)
                </button>
                <button class="dropdown-item" data-format="fbx" data-i18n="downloadFbx">
                    Unduh Avatar (FBX) (Legacy)
                </button>
            </div>
        </div>
    </div>

</main>

<script type="module">

import JSZip from

import { OrbitControls } from

    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/MTLLoader.js";

import { OBJLoader } from
    "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/OBJLoader.js";


// ---------------- i18n (Indonesia & English) ----------------

    },

        errorDownloadAssets: "Failed to download avatar assets.",
        errorOccurred: "An error occurred: {{message}}",
        reloadButton: "Reload Model",
        reloadNoAvatar: "Please search for a Roblox avatar first to load preview.",
        downloadObj: "Download OBJ",
        downloadObjOption: "OBJ + MTL + Textures",
        downloadFormatLabel: "Choose download format",
        downloadCreating: "Creating ZIP...",
        errorNoAvatarZip: "Please search for a Roblox avatar first.",
        errorZipFetch: "Failed to fetch {{file}}",
        alertZipFailed: "Failed to create ZIP: {{message}}",
        downloadGlb: "Download Avatar (GLB)",
        downloadGltf: "Download Avatar (GLTF)",
        downloadFbx: "Download Avatar (FBX) (Legacy)",
        errorConvertFailed: "Conversion failed: {{message}}",
        statusConverting: "Converting model to {{format}}...",
        explorerTitle: "Model Explorer",
        explorerEmpty: "Load an avatar to see its parts.",
        explorerPlayers: "Player (Body)",
        explorerHandles: "Handle (Accessories)",
        explorerOther: "Other",
        optionSeparateAssets: "Separate assets",
        optionAutoRig: "Auto-rig (R6/R15)",
        statusRigging: "Building auto-rig...",
        verticesLabel: "vertices"
    }
};

let currentLang = (() => {
    const stored = localStorage.getItem("aae_lang");
    if (stored === "id" || stored === "en") {
        return stored;
    }
    const nav = (navigator.language || navigator.userLanguage || "id").toLowerCase();
    return nav.startsWith("id") ? "id" : "en";
})();

function t(key, params = {}) {
    const dict = LANG[currentLang] || LANG.en;
    let text = dict[key] || LANG.en[key] || key;
    return text.replace(/\{\{(\w+)\}\}/g, (match, name) => {
        return params[name] !== undefined ? params[name] : match;
    });
}

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem("aae_lang", lang);
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach((el) => {
        el.textContent = t(el.dataset.i18n);
    });

    document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
    });

    document.querySelectorAll("[data-i18n-title]").forEach((el) => {
        el.title = t(el.dataset.i18nTitle);
    });

    const searchInputEl = document.getElementById("searchInput");
    if (searchInputEl) {
        searchInputEl.placeholder = t("usernamePlaceholder");
    }

    const sel = document.getElementById("langSelector");
    if (sel) {
        sel.value = lang;
    }

    // Re-apply the last tracked dynamic status so it translates too.
    if (currentStatusKey) {
        status.textContent = t(currentStatusKey, currentStatusParams || {});
    }
}

let currentStatusKey = null;
let currentStatusParams = {};

function setStatus(key, params = {}) {
    currentStatusKey = key;
    currentStatusParams = params;
    status.textContent = t(key, params);
}

function apiHeaders() {
    return {
        "Content-Type": "application/json",
        "Accept-Language": currentLang
    };
}

const langSelector = document.getElementById("langSelector");
langSelector.addEventListener("change", () => {
    setLang(langSelector.value);
});


const BACKEND_URL =
    window.__AAE_BACKEND_URL__ ||
    (location.port === "3001" || location.port === "5173"
        ? `${location.protocol}//${location.hostname}:3000`
        : "");


const viewer = document.getElementById("viewer");
const status = document.getElementById("status");

const searchInput =
    document.getElementById("searchInput");

const searchForm =
    document.getElementById("searchForm");

const searchButton =
    document.getElementById("searchButton");

const accountInfo =
    document.getElementById("accountInfo");

const downloadButton =
    document.getElementById("downloadButton");

const downloadToggle =
    document.getElementById("downloadToggle");

const downloadDropdown =
    document.getElementById("downloadDropdown");

const dropdownItems =
    document.querySelectorAll(".dropdown-item");

const reloadButton =
    document.getElementById("reloadButton");


const scene = new THREE.Scene();

scene.background = new THREE.Color(0x202738);


const camera = new THREE.PerspectiveCamera(
    45,
    viewer.clientWidth / viewer.clientHeight,
    0.1,
    1000
);

camera.position.set(0, 0, 12);


const renderer = new THREE.WebGLRenderer({
    antialias: true,
    outputColorSpace: THREE.SRGBColorSpace
});

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

viewer.appendChild(renderer.domElement);


const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;


scene.add(
    new THREE.AmbientLight(0xffffff, 0.5)
);


const light = new THREE.DirectionalLight(
    0xffffff,
    1.2
);

light.position.set(5, 10, 7);
light.castShadow = false;

scene.add(light);

// Fill light to prevent black/dark areas on sides not facing main light
const fillLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
scene.add(fillLight);

// Front fill light to brighten legs and front-facing surfaces
const frontLight = new THREE.DirectionalLight(0xffffff, 0.8);
frontLight.position.set(0, 5, 10);
scene.add(frontLight);


let currentModel = null;
let currentUserId = null;
let currentDisplayName = null;


// MEMUAT MODEL LOKAL ATAU AVATAR HASIL PENCARIAN

function loadModel(userId = null, bustCache = false) {

    const cacheBust = bustCache ? `?v=${Date.now()}` : "";

    const assetPath = userId
        ? `/assets/${encodeURIComponent(userId)}/`
        : "/assets/";

    setStatus("statusLoadingMaterial");

    const mtlLoader = new MTLLoader();

    mtlLoader.setPath(assetPath);

    mtlLoader.load(
        "avatar.mtl" + cacheBust,

        materials => {

            materials.preload();

            // --- Fix texture discoloration & transparency ---
            materials.materials = materials.materials || {};
            Object.values(materials.materials).forEach((material) => {
                if (!material) return;

                // Use both sides so faces aren't invisible
                material.side = THREE.DoubleSide;

                // Fix transparency: MTL "d" / "Tr" can force transparent:true
                // Keep opaque unless explicitly set in MTL
                if (material.transparent && material.opacity === 1) {
                    material.transparent = false;
                }

                // Ensure base color is white so MTL tint doesn't discolor textures (blue torso, etc.)
                material.color.setHex(0xffffff);

                // Default PBR values so legs don't go black in shadow
                material.roughness = material.roughness !== undefined ? material.roughness : 0.6;
                material.metalness = material.metalness !== undefined ? material.metalness : 0.05;

                // Fix texture color space (sRGB for diffuse/albedo maps)
                if (material.map) {
                    material.map.colorSpace = THREE.SRGBColorSpace;
                    material.map.needsUpdate = true;
                }
                if (material.aoMap) {
                    material.aoMap.colorSpace = THREE.SRGBColorSpace;
                    material.aoMap.needsUpdate = true;
                }
                if (material.emissiveMap) {
                    material.emissiveMap.colorSpace = THREE.SRGBColorSpace;
                    material.emissiveMap.needsUpdate = true;
                }
                if (material.specularMap) {
                    material.specularMap.colorSpace = THREE.SRGBColorSpace;
                    material.specularMap.needsUpdate = true;
                }
                if (material.alphaMap) {
                    material.alphaMap.colorSpace = THREE.SRGBColorSpace;
                    material.alphaMap.needsUpdate = true;
                }

                material.needsUpdate = true;
            });

            const objLoader = new OBJLoader();

            objLoader.setMaterials(materials);

            objLoader.setPath(assetPath);

            setStatus("statusLoadingModel");

            objLoader.load(
                "avatar.obj" + cacheBust,

                object => {

                    if (currentModel) {
                        scene.remove(currentModel);
                    }

                    currentModel = object;

                    scene.add(object);

                    const box = new THREE.Box3()
                        .setFromObject(object);

                    const center = box.getCenter(
                        new THREE.Vector3()
                    );

                    const size = box.getSize(
                        new THREE.Vector3()
                    );

                    object.position.sub(center);

                    const maxSize = Math.max(
                        size.x,
                        size.y,
                        size.z
                    );

                    camera.position.set(
                        0,
                        0,
                        -maxSize * 2.5
                    );

                    camera.lookAt(0, 0, 0);

                    controls.target.set(0, 0, 0);

                    controls.update();

                    setStatus("statusLoaded");

                },

                undefined,

                error => {

                    console.error(error);

                    setStatus(userId ? "statusLoadObjFailed" : "statusNoLocalModel");

                }
            );

        },

        undefined,

        error => {

            console.error(error);

            setStatus(userId ? "statusLoadMtlFailed" : "statusNoLocalModel");

        }
    );

}


// MEMBERSIHKAN PRATINJAU 3D SAAT PENCARIAN BARU DIMULAI

function clearPreview() {

    if (currentModel) {

        scene.remove(currentModel);

        currentModel = null;

    }

    // Reset kamera ke posisi awal agar tidak menampilkan model lama.

    camera.position.set(0, 0, 12);

    camera.lookAt(0, 0, 0);

    controls.target.set(0, 0, 0);

    controls.update();

    renderer.render(scene, camera);

    currentUserId = null;

    accountInfo.style.display = "none";

    buildExplorer(null);

}


// MODEL EXPLORER — parse OBJ groups client-side and render a tree

async function buildExplorer(userId) {

    const treeEl = document.getElementById("explorerTree");

    const countEl = document.getElementById("explorerCount");

    if (!userId) {

        treeEl.innerHTML = `<div class="explorer-empty">${t("explorerEmpty")}</div>`;

        countEl.textContent = "";

        return;

    }

    try {

        const assetPath = `/assets/${encodeURIComponent(userId)}/`;

        const response = await fetch(assetPath + "avatar.obj");

        if (!response.ok) throw new Error("Failed to fetch OBJ");

        const text = await response.text();

        const groups = {};

        let currentGroup = null;

        for (const raw of text.split(/\r?\n/)) {

            const line = raw.trim();

            if (line.startsWith("g ")) {

                currentGroup = line.slice(2).trim() || null;

                if (currentGroup && !groups[currentGroup]) {

                    groups[currentGroup] = { faces: 0, vertices: new Set() };

                }

            } else if (line.startsWith("f ") && currentGroup) {

                groups[currentGroup].faces++;

                const parts = line.split(/\s+/);

                for (let i = 1; i < parts.length; i++) {

                    const v = parts[i].split("/")[0];

                    if (v) groups[currentGroup].vertices.add(parseInt(v, 10));

                }

            }

        }

        const groupNames = Object.keys(groups).filter(n => groups[n].faces > 0);

        const playerGroups = groupNames.filter(n => n.startsWith("Player"));

        const handleGroups = groupNames.filter(n => n.startsWith("Handle"));

        const otherGroups = groupNames.filter(n => !n.startsWith("Player") && !n.startsWith("Handle"));

        countEl.textContent = `${groupNames.length}`;

        let html = "";

        const renderSection = (label, names, cls) => {

            if (!names.length) return;

            html += `<div class="explorer-section-label">${label} (${names.length})</div>`;

            for (const name of names) {

                const g = groups[name];

                html += `<div class="explorer-node" title="${escapeHTML(name)}">`

                    + `<span class="node-icon ${cls}"></span>`

                    + `<span class="node-name">${escapeHTML(name)}</span>`

                    + `<span class="node-meta">${g.vertices.size} v</span>`

                    + `</div>`;

            }

        };

        renderSection(t("explorerPlayers"), playerGroups, "player");

        renderSection(t("explorerHandles"), handleGroups, "handle");

        renderSection(t("explorerOther"), otherGroups, "other");

        treeEl.innerHTML = html || `<div class="explorer-empty">${t("explorerEmpty")}</div>`;

    } catch (e) {

        console.error(e);

        treeEl.innerHTML = `<div class="explorer-empty">${t("explorerEmpty")}</div>`;

        countEl.textContent = "";

    }

}


// PENCARIAN USERNAME ROBLOX

searchButton.addEventListener(
    "click",
    async () => {

        const username = searchInput.value.trim();

        if (!username) {

            setStatus("errorEmptyUsername");

            return;

        }

        clearPreview();

        searchButton.disabled = true;

        searchButton.textContent = t("searchButtonSearching");

        accountInfo.style.display = "none";

        try {

            setStatus("statusSearching");

            const userResponse = await fetch(
                BACKEND_URL + "/api/roblox/user",
                {
                    method: "POST",
                    headers: apiHeaders(),
                    body: JSON.stringify({
                        username: username
                    })
                }
            );

            const userResult = await userResponse.json();

            if (!userResponse.ok || !userResult.success) {
                throw new Error(
                    userResult.message ||
                    t("errorNotFound")
                );
            }

            const user = userResult.user;
            currentDisplayName = user.displayName || user.username;

            accountInfo.innerHTML = `
                <strong>${t("accountInfoTitle")}</strong><br>
                ${t("usernameLabel")}: ${escapeHTML(user.username)}<br>
                ${t("displayNameLabel")}: ${escapeHTML(user.displayName)}<br>
                ${t("userIdLabel")}: ${user.id}
            `;

            accountInfo.style.display = "block";


            setStatus("statusFetchMetadata");


            const avatarResponse = await fetch(
                BACKEND_URL +
                "/api/roblox/avatar/" +
                encodeURIComponent(user.id),
                { headers: apiHeaders() }
            );

            const avatarResult = await avatarResponse.json();

            if (!avatarResponse.ok || !avatarResult.success) {
                throw new Error(
                    avatarResult.message ||
                    t("errorFetchMetadata")
                );
            }

            setStatus("statusDownloadAssets");

            const downloadResponse = await fetch(
                BACKEND_URL +
                "/api/roblox/download/" +
                encodeURIComponent(user.id),
                { headers: apiHeaders() }
            );

            const downloadResult = await downloadResponse.json();

            if (!downloadResponse.ok || !downloadResult.success) {
                throw new Error(
                    downloadResult.message ||
                    t("errorDownloadAssets")
                );
            }

            currentUserId = user.id;

            setStatus("statusDownloaded");

            loadModel(currentUserId);

            buildExplorer(currentUserId);

        } catch (error) {

            console.error(error);

            setStatus("errorOccurred", { message: error.message });

        } finally {

            searchButton.disabled = false;

            searchButton.textContent = t("searchButton");

        }

    }
);


// ENTER DI INPUT USERNAME = KLIK TOMBOL CARI

searchForm.addEventListener("submit", (event) => {

    event.preventDefault();

    // Reuse the existing click handler; a disabled button ignores click().
    searchButton.click();

});


// MENCEGAH HTML DARI USERNAME

function escapeHTML(value) {

    return String(value).replace(
        /[&<>"']/g,
        character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        })[character]
    );

}

            return;
        }

            setStatus("statusDownloadAssets");

downloadButton.addEventListener("click", async () => {

// ITEM DROPDOWN: FORMAT LAIN

dropdownItems.forEach((item) => {

    item.addEventListener("click", async (event) => {

        event.stopPropagation();

        const format = item.dataset.format;

        closeDropdown();

        if (!currentUserId) {

            return;

        }

        downloadToggle.disabled = true;

                await downloadZip();
            } else {
                await downloadConverted(format);
            }

        } catch (error) {

            alert(t("errorConvertFailed", { message: error.message }));

        } finally {

            downloadButton.disabled = false;
            downloadToggle.disabled = false;
            downloadButton.textContent = t("downloadObj");

        }

    });

});

async function downloadZip() {

    downloadButton.textContent = t("downloadCreating");

    const assetPath =
        `/assets/${encodeURIComponent(currentUserId)}/`;

    const safeName = String(currentDisplayName || "Avarixen").replace(/[\\/:*?"<>|]/g, "_").trim().replace(/[. ]+$/g, "") || "Avarixen";
    const baseName = safeName.toLowerCase();

    const files = [
        "avatar.obj",
        "avatar.mtl"
    ];

    let textureIndex = 1;

    while (true) {
        const filename = `texture${textureIndex}.png`;

        const check = await fetch(assetPath + filename, {
            method: "HEAD"
        });

        if (!check.ok) break;

        files.push(filename);
        textureIndex++;
    }

    const zip = new JSZip();

    for (const file of files) {

        const response = await fetch(
            assetPath + file
        );

        if (!response.ok) {

            throw new Error(
                t("errorZipFetch", { file })
            );

        }

        let content = await response.blob();

        if (file === "avatar.obj") {
            let objText = await content.text();
            objText = objText.replace(/^mtllib\s+.*$/m, `mtllib ${baseName}.mtl`);
            content = new Blob([objText], { type: "text/plain" });
        }

        if (file === "avatar.mtl") {
            content = new Blob(
                [await content.text()],
                { type: "text/plain" }
            );
        }

        const zipFileName =
            file === "avatar.obj" ? `${baseName}.obj` :
            file === "avatar.mtl" ? `${baseName}.mtl` :
            file;

        zip.file(
            `${safeName}/${zipFileName}`,
            content
        );

    }

    const blob = await zip.generateAsync({
        type: "blob"
    });

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;

    const zipName = String(currentDisplayName || "Avarixen-Avatar").replace(/[\\/:*?"<>|]/g, "_").trim().replace(/[. ]+$/g, "") || "Avarixen-Avatar";
    link.download = `${safeName}_${currentUserId}.zip`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(
        () => URL.revokeObjectURL(url),
        1000
    );

    downloadButton.textContent = t("downloadObj");
}

async function downloadConverted(format) {

    const rig = document.getElementById("autoRig").checked;

    // "Separate assets" only affects GLB/GLTF; OBJ and FBX are always separate.
    const separate = document.getElementById("separateAssets").checked
        && (format === "glb" || format === "gltf");

    const convertUrl = `${BACKEND_URL}/api/roblox/convert/${encodeURIComponent(currentUserId)}/${format}`;

    const params = new URLSearchParams();
    if (rig) params.set("rig", "1");
    if (separate) params.set("separate", "1");
    const qs = params.toString();
    const url = qs ? `${convertUrl}?${qs}` : convertUrl;

    if (rig) {
        setStatus("statusRigging");
    } else {
        setStatus("statusConverting", { format: format.toUpperCase() });
    }

    const response = await fetch(url, {
        headers: apiHeaders()
    });

    if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.message || t("errorConvertFailed", { message: "Unknown error" }));
    }

    const contentType = response.headers.get("content-type") || "";
    const blob = await response.blob();
    const objUrl = URL.createObjectURL(blob);

    const safeName = String(currentDisplayName || "Avarixen").replace(
        /[\\/:*?"<>|]/g,
        "_"
    ).trim().replace(/[. ]+$/g, "") || "Avarixen";

    // Separate mode returns a ZIP instead of a bare model file.
    let ext = format;
    if (contentType.includes("zip")) ext = "zip";

    const link = document.createElement("a");
    link.href = objUrl;
    link.download = `${safeName}_${currentUserId}.${ext}`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(objUrl), 1000);
    setStatus("statusDownloaded");
}
